services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pedidos
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-BR"
    ports:
      - "5432:5432"
    volumes:
      - ./back-end/db:/docker-entrypoint-initdb.d:ro
      - ./seed.json:/seed/seed.json:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos"]
      interval: 2s
      timeout: 3s
      retries: 15

  back:
    build: ./back-end
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pedidos
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front-end
      args:
        VITE_API_URL: http://localhost:3333
    ports:
      - "5173:80"
    depends_on:
      - back

volumes:
  db-data:
